[package]
name = "gvpndows"
version = "0.1.0"
edition = "2021"
description = "Gnosis VPN for Windows (test app)"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
# Same WireGuard implementation and tag as gnosis_vpn-client (noise only, no device feature).
neptun = { git = "https://github.com/NordSecurity/neptun.git", tag = "v3.0.6", default-features = false }
base64 = "0.22"
getrandom = "0.2"
# HTTPS to ntfy.sh for "send key/log to developer" (rustls + bundled roots, no OS TLS).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Identity backup sealing (same versions as already in the client's lock).
chacha20poly1305 = "0.10"
sha2 = "0.10"

# The Gnosis VPN client core. This crate is built as a member of a gnosis_vpn-client (main)
# checkout (patched for Windows, see rust/patches and scripts/do-build/build-remote.sh).
gnosis_vpn-lib = { path = "../gnosis_vpn-lib" }
gnosis_vpn-ipc = { path = "../gnosis_vpn-ipc" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "registry"] }
serde_json = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Profiles come from the client workspace root (fast overrides in build-remote.sh).
