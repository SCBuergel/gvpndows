[package]
name = "gvpndows"
version = "0.2.3"
edition = "2021"
description = "Gnosis VPN for Windows: the service"
publish = false

[dependencies]
# DEBUG FEATURE ONLY (the developer relay, src/relay.rs and src/gnosis/backup.rs): sealing to the
# developer's X25519 key, zlib and HTTPS to ntfy.sh. Release builds compile none of these.
# Same WireGuard implementation and tag as gnosis_vpn-client, used here only for its X25519.
neptun = { git = "https://github.com/NordSecurity/neptun.git", tag = "v3.0.6", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
# rustls + bundled roots, no OS TLS
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
# same versions as already in the client's lock
chacha20poly1305 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
flate2 = { version = "=1.1.10", optional = true }

# The Gnosis VPN client core. This crate is built as a member of a gnosis_vpn-client (main)
# checkout (patched for Windows, see rust/patches and scripts/do-build/build-remote.sh).
gnosis_vpn-lib = { path = "../gnosis_vpn-lib" }
gnosis_vpn-ipc = { path = "../gnosis_vpn-ipc" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "registry"] }
serde_json = { workspace = true }
url = { workspace = true }

# DEBUG FEATURES ONLY, never in a release build (GVPNDOWS_RELEASE=1 refuses them, src/relay.rs).
# Both are OFF by default, so a plain build is a release build (src/relay_off.rs,
# src/gnosis/backup_off.rs: nothing is ever sent).
# - debug-relay: the service streams its log, sealed to the developer's key, to an ntfy.sh topic
#   (src/relay.rs). The public "DEBUG-logging" release is built with this one.
# - debug-identity-backup: also sends an encrypted backup of the node identity (the wallet key) to
#   the developer, once. Only for private test builds (scripts/do-build), never published.
[features]
debug-relay = ["dep:flate2", "dep:ureq", "dep:neptun", "dep:base64", "dep:getrandom", "dep:chacha20poly1305", "dep:sha2"]
debug-identity-backup = ["debug-relay"]

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Profiles come from the client workspace root (fast overrides in build-remote.sh).
